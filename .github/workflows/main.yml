name: NCA Electrical Suite - Android and Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        shell: bash
        run: |
          set -e

          if [ -f "android.rar" ]; then
            sudo apt-get update
            sudo apt-get install -y unrar
            mkdir -p android_src
            unrar x -o+ android.rar android_src/
          elif [ -d "android" ]; then
            cp -r android android_src
          else
            echo "Android source not found"
            exit 1
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android_src -type f -name "settings.gradle" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find android_src -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          fi

          test -n "$PROJECT_DIR"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug --stacktrace
          else
            gradle --no-daemon :app:assembleDebug --stacktrace
          fi

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$ANDROID_PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          ls -lh "$APK_FILE"

      - name: Prepare Android artifact
        shell: bash
        run: |
          set -e

          cp "$APK_FILE" NCA-Electrical-Suite-v4.1-debug.apk

          sha256sum \
            NCA-Electrical-Suite-v4.1-debug.apk \
            > NCA-Electrical-Suite-v4.1-debug.apk.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCA-Electrical-Suite-v4.1-Android
          path: |
            NCA-Electrical-Suite-v4.1-debug.apk
            NCA-Electrical-Suite-v4.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30


  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Windows source
        shell: pwsh
        run: |
          if (Test-Path "windows.rar") {

            New-Item -ItemType Directory -Force -Path windows_src | Out-Null

            $sevenZip = "C:\Program Files\7-Zip\7z.exe"

            if (-not (Test-Path $sevenZip)) {
              throw "7-Zip not found"
            }

            & $sevenZip x windows.rar "-owindows_src" -y

          }
          elseif (Test-Path "windows") {

            Copy-Item windows windows_src -Recurse -Force

          }
          else {

            throw "Windows source not found"

          }

      - name: Locate Windows project
        shell: pwsh
        run: |

          $package = Get-ChildItem `
            -Path windows_src `
            -Filter package.json `
            -Recurse `
            | Select-Object -First 1

          if (-not $package) {
            throw "package.json not found"
          }

          $projectDir = $package.Directory.FullName

          "WINDOWS_PROJECT_DIR=$projectDir" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Windows project found at: $projectDir"

      - name: Install Windows dependencies
        shell: pwsh
        run: |

          Set-Location "$env:WINDOWS_PROJECT_DIR"

          npm install

      - name: Build Windows EXE
        shell: pwsh
        run: |

          Set-Location "$env:WINDOWS_PROJECT_DIR"

          npm run dist:win

      - name: Locate EXE
        shell: pwsh
        run: |

          $exe = Get-ChildItem `
            -Path "$env:WINDOWS_PROJECT_DIR\dist" `
            -Filter *.exe `
            -Recurse `
            | Select-Object -First 1

          if (-not $exe) {
            throw "EXE not found"
          }

          Copy-Item `
            $exe.FullName `
            "NCA-Electrical-Suite-v4.1.exe"

          (Get-FileHash `
            "NCA-Electrical-Suite-v4.1.exe" `
            -Algorithm SHA256).Hash |
            Out-File `
              "NCA-Electrical-Suite-v4.1.exe.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCA-Electrical-Suite-v4.1-Windows
          path: |
            NCA-Electrical-Suite-v4.1.exe
            NCA-Electrical-Suite-v4.1.exe.sha256
          if-no-files-found: error
          retention-days: 30
